services:
  db:
    image: postgres:16-alpine
    # Postgres puts its dynamic shared memory in /dev/shm, which Docker caps at
    # 64MB by default. Parallel query workers and parallel index vacuuming both
    # fail outright once that cap is reached. Sized smaller than the dev value
    # because this host runs the whole stack in 8GB; /dev/shm is tmpfs, so this
    # is a ceiling rather than a reservation.
    shm_size: 256mb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-3}"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?DJANGO_ALLOWED_HOSTS is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?CSRF_TRUSTED_ORIGINS is required}
      DJANGO_SESSION_COOKIE_SECURE: ${DJANGO_SESSION_COOKIE_SECURE:-true}
      DJANGO_CSRF_COOKIE_SECURE: ${DJANGO_CSRF_COOKIE_SECURE:-true}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-false}
      DJANGO_USE_X_FORWARDED_PROTO: ${DJANGO_USE_X_FORWARDED_PROTO:-true}
      DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-0}
      DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: ${DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS:-false}
      DJANGO_SECURE_HSTS_PRELOAD: ${DJANGO_SECURE_HSTS_PRELOAD:-false}
      # One proxy hop (our nginx), so DRF throttling keys on the real client IP.
      NUM_PROXIES: ${NUM_PROXIES:-1}
      THROTTLE_LOGIN: ${THROTTLE_LOGIN:-10/min}
      THROTTLE_REGISTER: ${THROTTLE_REGISTER:-10/hour}
      THROTTLE_PASSWORD_RESET: ${THROTTLE_PASSWORD_RESET:-5/hour}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-false}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-no-reply@localhost}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      STATIC_URL: ${STATIC_URL:-/static/}
      STATIC_ROOT: ${STATIC_ROOT:-staticfiles}
      MEDIA_URL: ${MEDIA_URL:-/media/}
      MEDIA_ROOT: ${MEDIA_ROOT:-media}
    expose:
      - "8000"
    volumes:
      - backend_static:/app/staticfiles
      - backend_media:/app/media
      # Bind mount, not a named volume: backups exist to be copied off this box,
      # and a path inside the image would be discarded by the next rebuild —
      # the one moment a backup has to survive.
      - ${BACKUP_DIR:-./backups}:/app/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - backend_static:/var/www/static:ro
      - backend_media:/var/www/media:ro
      - certbot_etc:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - backend
    restart: unless-stopped
    # Deliberately no `command:` override here. The nginx image only runs its
    # /docker-entrypoint.d/ scripts — including the envsubst pass that renders
    # default.conf.template — when the command starts with `nginx`. Overriding
    # it with a shell wrapper silently skips template rendering and the stock
    # config is served instead. nginx must be reloaded after a renewal to pick
    # up the new certificate; scripts/reload-cron.sh installs that as a host
    # cron entry rather than smuggling a loop in here.

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Certificates last 90 days and certbot only acts once one is within 30 days
    # of expiring, so this mostly no-ops. Twice a day is what the ACME client
    # docs recommend, to spread load and to survive a failed attempt.
    entrypoint: >
      sh -c "trap exit TERM; while :; do
             certbot renew --webroot -w /var/www/certbot --quiet;
             sleep 12h & wait $${!}; done"
    depends_on:
      - nginx
    restart: unless-stopped

volumes:
  postgres_data:
  backend_static:
  backend_media:
  certbot_etc:
  certbot_www:
